name: PrismRush
options:
  bundleIdPrefix: com.rayancheca
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # HUMAN GATE: operator pastes the Apple Developer Team ID here before archiving (Phase 8).
    # Left blank so Simulator builds (which do not sign) stay green. See state.md.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIStatusBarHidden: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
targets:
  PrismRush:
    type: application
    platform: iOS
    sources:
      - path: PrismRush
    entitlements:
      path: PrismRush/Support/PrismRush.entitlements
      properties:
        com.apple.developer.game-center: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rayancheca.prismrush
        PRODUCT_NAME: PrismRush
        INFOPLIST_KEY_CFBundleDisplayName: Prism Rush
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  PrismRushTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PrismRush
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rayancheca.prismrush.tests
schemes:
  PrismRush:
    build:
      targets:
        PrismRush: all
        PrismRushTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Products.storekit
    test:
      targets:
        - PrismRushTests
      gatherCoverageData: true
