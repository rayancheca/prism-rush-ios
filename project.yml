name: PrismRush
options:
  bundleIdPrefix: com.rayancheca
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: "8M64JJQQAU"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIStatusBarHidden: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
targets:
  PrismRush:
    type: application
    platform: iOS
    sources:
      - path: PrismRush
    entitlements:
      path: PrismRush/Support/PrismRush.entitlements
      properties:
        com.apple.developer.game-center: true
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rayancheca.prismrush
        PRODUCT_NAME: PrismRush
        INFOPLIST_KEY_CFBundleDisplayName: Prism Rush
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # App icon lives in PrismRush/Assets.xcassets (modern single-size 1024 — the same PNG
        # Tools/gen_icon.swift renders for the App Store; the catalog just bundles its output).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PrismRushTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PrismRush
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rayancheca.prismrush.tests
  PrismRushUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: PrismRush
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rayancheca.prismrush.uitests
        CODE_SIGNING_ALLOWED: NO
schemes:
  PrismRush:
    build:
      targets:
        PrismRush: all
        PrismRushTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Products.storekit
    test:
      targets:
        - PrismRushTests
        - PrismRushUITests
      gatherCoverageData: true
